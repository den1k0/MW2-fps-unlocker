; ---------------------------------------------------------------------------
; MW2 (2009) 64-bit FPS / FOV Unlocker - configuration
;
; You only set the values you care about. The unlocker finds the game's own
; settings for you, so there are no addresses to look up and no offsets to
; count.
;
; You do not have to edit this file by hand: MW2Unlocker.exe has a window with
; sliders and checkboxes for the frame cap and the field of view, and it reads
; and writes this file. Edit it directly for the settings the window does not
; show (the toggle key, the delays, the manual feature definitions below).
;
;     [fps]
;     value=250
;
;     [fov]
;     value=90
;
;     [drawfps]
;     value=1
;
; These work in single player (iw4sp.exe) and multiplayer (iw4mp.exe): the
; correct cvar is located by name at run time, so nothing here breaks when the
; game is updated or restarted.
; ---------------------------------------------------------------------------

[general]
; How long to wait after injection before applying, in milliseconds.
delayMs=5000
; Key that toggles the patches on and off in game.
; 0x75 = F6, 0x76 = F7, 0x77 = F8, 0x78 = F9, 0x79 = F10, 0x7A = F11, 0x7B = F12
toggleKey=0x75
; Launcher only: 1 = the window closes when the game does, 0 = wait for a key.
; There is a box for this in the window, under Other Settings.
closeWithGame=1
; The engine re-initialises some values after we write them - cg_fov in
; particular when a level loads or you respawn. Without this, the FOV snaps
; back to its default 65 and stays there until something rewrites it.
; 1 = keep the values applied (recommended), 0 = write them once.
keepApplied=1
; How often to re-check, in milliseconds. A reset is visible for this long
; before being corrected, so keep it short. The check is only a few 4-byte
; reads of our own process memory, so 100 costs nothing measurable.
; 0 disables the re-check while leaving keepApplied's single write in place.
keepAliveMs=50
; Optional. Leave empty to use whichever game you injected into.
gameExe=

; ---------------------------------------------------------------------------
; FRAME RATE CAP
;
; The cap is com_maxfps, an integer that defaults to 85. It is NOT a float,
; which is why searching memory for 91 or 85 never finds it.
;
;   0    = uncapped
;   250  = a sensible ceiling
;   1000 = effectively uncapped
; ---------------------------------------------------------------------------
[fps]
enabled=1
value=333

; ---------------------------------------------------------------------------
; FIELD OF VIEW
;
; cg_fov, in degrees. The engine normally clamps this to 80, so if your value
; will not stick, uncomment the line below to raise that clamp as well.
; ---------------------------------------------------------------------------
[fov]
enabled=1
value=67
max=0

; ---------------------------------------------------------------------------
; MUSIC  (one of the "Other Settings" switches in the window)
;
; snd_enableStream is what the sound code tests before it starts a streamed
; sound, and the soundtrack is streamed, so holding it at 0 is what keeps the
; music away. Three places in the sound module read it, every one of them as a
; gate:
;
;     mov rax, [snd_enableStream]
;     cmp byte ptr [rax + 0x10], 0
;     je  <skip the stream setup>
;
; Guides tell you to follow this with `snd_restart`. In this build that does
; nothing at all: snd_restart is registered in the command table against
; rva 0x80E50, which is `C2 00 00` - `ret 0`, a function that returns
; immediately - and no other code refers to the name, so nothing is left that
; could react to it. There is no snd_restart dvar either.
;
; What does matter is that this is a sound setting the game saves and reloads
; with the rest of them, so a single write does not stick. It is re-applied by
; the engine's watchdog like the other live features, which is what actually
; keeps the music off.
;
; The soundtrack is not the only streamed audio in the engine, so anything else
; that streams is affected too. This is "no streamed audio", not a music-only
; switch.
;
;   0 = music allowed
;   1 = music off
; ---------------------------------------------------------------------------
[music]
enabled=1

; ---------------------------------------------------------------------------
; FULLBRIGHT  (r_fullbright)
;
; Draws the world unlit: no shadows, no lightmaps, everything flat and equally
; bright. Read from six places in this build, so the write lands. The window
; labels this "Fullbright world" and enabling it writes 1.
; ---------------------------------------------------------------------------
[r_fullbright]
enabled=0

; ---------------------------------------------------------------------------
; HIDE THE HUD  (cg_draw2D)
;
; The whole 2D overlay: the HUD, the crosshair, the on-screen counters. Read
; from three places. The window labels this "Hide the HUD", so enabling it
; writes 0 - leaving it at the game's own 1 would do nothing.
; ---------------------------------------------------------------------------
[cg_draw2D]
enabled=0

; ---------------------------------------------------------------------------
; HIDE THE WEAPON MODEL  (cg_drawGun)
;
; "Draw the view model", in the binary's own description of it. Read from four
; places, all in the view-model drawing path. Enabling this writes 0, so the
; first-person weapon is not drawn - what players mean by "no gun".
; ---------------------------------------------------------------------------
[cg_drawGun]
enabled=0

; ---------------------------------------------------------------------------
; DISABLE THE FOG  (r_fog)
;
; The distance fog the renderer draws. Read once, from the view setup. The window
; labels this "Disable the fog", so enabling it writes 0.
; ---------------------------------------------------------------------------
[r_fog]
enabled=0

; ---------------------------------------------------------------------------
; ENABLE THE FILM TWEAK  (writes both r_filmUseTweaks and r_filmTweakEnable)
;
; The colour grade the game puts over the scene - the contrast, brightness,
; desaturation and tint pass. It sits behind *two* gates, and both have to be
; open:
;
;     rva 0x2127B  mov rax, [r_filmUseTweaks]
;     rva 0x21282  cmp byte ptr [rax + 0x10], 0
;     rva 0x21286  je  <skip the whole copy>
;     rva 0x2128C  mov rax, [r_filmTweakEnable]    ; only reached if the above is on
;     rva 0x2129E  mov [rbx + 0x220], cl           ; the flag, copied per frame
;
; With r_filmUseTweaks at 0 the renderer never copies the family at all, so
; setting r_filmTweakEnable on its own is read by nothing - which is exactly what
; happened the first time this was tried. Both are registered off, and switching
; this section on writes 1 to both of them.
;
; The parameters are already at these values when the game starts:
;
;     r_filmTweakContrast 1.4        r_filmTweakDarkTint 0.7
;     r_filmTweakBrightness 0        r_filmTweakMediumTint 0.9
;     r_filmTweakDesaturation 0.2    r_filmTweakLightTint 1.1
;     r_filmTweakDesaturationDark 0.2    r_filmTweakInvert 0
;
; so writing them would change nothing. Each of the six has a section of its own
; below, and a slider in the window; a default left alone is a no-op either way.
; ---------------------------------------------------------------------------
[r_filmTweakEnable]
enabled=0

; ---------------------------------------------------------------------------
; FILM TWEAK PARAMETERS  (Contrast, Brightness, Desaturation, tints)
;
; The values the grade is made of, so it can be tuned rather than only switched
; on. All six are floats, and these are the values the game registers them with:
;
;     r_filmTweakContrast      1.4     1.0 would be "no contrast change"
;     r_filmTweakBrightness    0.0
;     r_filmTweakDesaturation  0.2
;     r_filmTweakLightTint     1.1
;     r_filmTweakMediumTint    0.9
;     r_filmTweakDarkTint      0.7
;
; The window's sliders follow the domains the game registers: contrast 0.00-3.00,
; brightness -1.00-1.00, desaturation -1.00-2.00, and the three tints 0.00-2.00.
; Those are the useful spans rather than the game's own clamps - the unlocker
; writes the value directly instead of going through the game's setter, so this
; file accepts anything. The defaults above are what the game starts with, so a
; slider that is left alone changes nothing.
;
; None of these is read unless the grade itself is on, so they do nothing while
; [r_filmTweakEnable] - or the window's switch - is off.
;
; Not here, and not a slider: r_filmTweakInvert is a flag rather than a value.
;
; The three tints are colour dvars. The game registers each with four floats
; (red, green, blue and an unused fourth) through a different helper, and hands a
; pointer to that block onwards. One float cannot express a colour, so these
; sections list the first three components in valueOffsets - 0x10, 0x14, 0x18 -
; and the same number goes into all three, which is a grey tint. That is the
; shape the game's own defaults have, too: all three tints are grey.
; ---------------------------------------------------------------------------
[r_filmTweakContrast]
enabled=0
value=1.4

[r_filmTweakBrightness]
enabled=0
value=0

[r_filmTweakDesaturation]
enabled=0
value=0.2

[r_filmTweakLightTint]
enabled=0
value=1.1

[r_filmTweakMediumTint]
enabled=0
value=0.9

[r_filmTweakDarkTint]
enabled=0
value=0.7

; ---------------------------------------------------------------------------
; VIEWMODEL POSITION  (cg_gun_x, cg_gun_y, cg_gun_z)
;
; Where the first-person weapon sits, in engine units. The binary's own
; descriptions are:
;
;     cg_gun_x   "Forward position of the viewmodel"
;     cg_gun_y   "Right position of the viewmodel"
;     cg_gun_z   "Up position of the viewmodel"
;
; All three are floats defaulting to 0 with no clamp worth speaking of (the
; minimum their registration passes is -FLT_MAX), and each is read once, where
; the viewmodel origin is built. The window offers them as one setting - a
; switch and three sliders - so the same enabled flag is written to all three
; sections; moving the weapon in one axis alone is not a thing anyone wants.
;
; The window's sliders cover -10.00 to +10.00. The config takes any value at all;
; these are engine units, so 1.0 is a nudge and 10.0 is well past useful.
; ---------------------------------------------------------------------------
[cg_gun_x]
enabled=0
value=0

[cg_gun_y]
enabled=0
value=0

[cg_gun_z]
enabled=0
value=0

; ---------------------------------------------------------------------------
; MOUSE SENSITIVITY  (no longer offered in the window)
;
; The idea was the same setting as the game's own sensitivity slider, except that
; one shows no number, so there is no way to land on an exact value in game.
;
; It did not do that, so the window no longer shows it. The disassembly says the
; mouse-look code reads this cvar every single frame -
;
;     factor = (sqrt(dx*dx + dy*dy) / max) * cl_mouseAccel + sensitivity
;
; - and writing it was still measured to change nothing in game, so the value the
; aim obeys is evidently not this one: the game keeps its own copy in the player
; profile and reads that. See docs/how-it-works.md for the whole trail, including
; the profile field the game's own profile_setViewSensitivity command writes.
;
; The section is kept because it still does something useful and costs nothing.
; Setting enabled=1 here makes Apply write the cvar *and* the game's own settings
; file -
;
;     <game folder>\players\config_mp.cfg        seta sensitivity "3.45"
;
; - quoted exactly the way the game writes its own lines. Editing that line by
; hand and then starting the game does change the aim, so this is the path that
; works; it just needs a launch. The game saves its own settings over that file
; as it exits, which would undo a line written while it was running, so the
; unlocker writes the line again once the game has closed.
;
; Off by default on purpose: it is the one setting here that changes how the game
; plays rather than how it looks, so it is not set until it is asked for.
;
; Worth recording, because it cost a while: the binary holds a profile field
; label "Sensitivity" as well as the cvar "sensitivity". Name lookups used to
; stop at the first case-insensitive match, which landed on the label, found
; nothing pointing at it, and reported the cvar as missing - so every write was
; skipped and the setting looked like it did nothing. Lookups now try every
; occurrence and keep the one a dvar actually points at.
; ---------------------------------------------------------------------------
[sensitivity]
enabled=0
value=5

; ---------------------------------------------------------------------------
; IN-GAME FPS DISPLAY  (single player only)
;
; cg_drawFPS is the engine's own frame counter, which is worth having because an
; external overlay (Steam, RTSS) counts the frames it is handed, and that is not
; necessarily the number the engine computes for itself.
;
; It is an enum, not a 0/1 flag:
;
;   0 = Off            3 = Verbose
;   1 = Simple         4 = Verbose+Viewpos
;   2 = SimpleRanges
;
; WARNING - this does nothing in multiplayer. iw4sp.exe reads the cvar from six
; places; iw4mp.exe registers it and then never reads it, so in multiplayer the
; value is written and silently ignored, and there is no frame counter to turn
; on. That was measured against both binaries rather than assumed - the evidence
; is in docs/finding-signatures.md. Shipped disabled for that reason.
;
; cg_drawFPSLabels and cg_drawViewpos are the same story, so they are not offered
; as switches: registered in iw4mp.exe, read by nothing. cg_drawViewpos ("Draw
; viewpos" in the binary's words) has exactly one reference - the store that
; caches its own pointer - so there is nowhere for a write of ours to land.
;
; Note the capital FPS: that is the binary's spelling, not a typo. Guides write
; cg_drawfps, the game spells it cg_drawFPS. Lookups here are case-insensitive.
; ---------------------------------------------------------------------------
[drawfps]
enabled=0
value=1

; ---------------------------------------------------------------------------
; NETWORK FPS DISPLAY  (multiplayer)
;
; sv_network_fps is the only debug counter the multiplayer client still reads,
; so it is the only number you can put on screen there. Be aware of what it is:
; the network/snapshot rate, not the render frame rate. It sits far lower than
; your fps, and it is the figure the old "91" cap was about.
;
;   0 = off
;   1 = on
; ---------------------------------------------------------------------------
[netfps]
enabled=0
value=1

; ---------------------------------------------------------------------------
; LAGOMETER  (multiplayer)
;
; drawLagometer - "Enable the 'lagometer'" in the binary's own words. It exists
; in iw4mp.exe only (single player does not have it at all), and the multiplayer
; client never reads it, so it is expected to do nothing - the same signature as
; the FPS counter. Shipped disabled; enable it if you want to try, because the
; write itself does land, so the only open question is whether anything draws.
; ---------------------------------------------------------------------------
[lagometer]
enabled=0
value=1

; ===========================================================================
; ADVANCED - you do not need any of this for normal use.
; ===========================================================================
;
; Each preset is shorthand for a full description, and you can override any part
; of it: `type=`, `cvar=`, `valueOffsets=`, `nameStringRva=` and `module=`.
;
; All of these are available:
;
;   [fps]     ->  dvar_int   com_maxfps       valueOffsets 0x10,0x20,0x30
;   [fov]     ->  dvar_float cg_fov           valueOffsets 0x10,0x20,0x30, optional max= for the +0x44 clamp
;   [drawfps] ->  dvar_int   cg_drawFPS       valueOffsets 0x10,0x20,0x30  (single player only)
;   [netfps]  ->  dvar_int   sv_network_fps   valueOffsets 0x10,0x20,0x30
;   [lagometer] -> dvar_int  drawLagometer    valueOffsets 0x10,0x20,0x30  (multiplayer, expected to do nothing)
;   [sensitivity] -> dvar_float sensitivity   valueOffsets 0x10,0x20,0x30
;   [music]   ->  dvar_int   snd_enableStream valueOffsets 0x10,0x20,0x30  (writes 0)
;   [r_fullbright] -> dvar_int r_fullbright  valueOffsets 0x10,0x20,0x30  (writes 1)
;   [cg_draw2D]    -> dvar_int cg_draw2D     valueOffsets 0x10,0x20,0x30  (writes 0)
;   [cg_drawGun]   -> dvar_int cg_drawGun    valueOffsets 0x10,0x20,0x30  (writes 0)
;   [r_fog]        -> dvar_int r_fog         valueOffsets 0x10,0x20,0x30  (writes 0)
;   [r_filmTweakEnable] -> dvar_int r_filmTweakEnable valueOffsets 0x10,0x20,0x30 (writes 1)
;   [r_filmUseTweaks]   -> dvar_int r_filmUseTweaks   valueOffsets 0x10,0x20,0x30 (writes 1)
;                          - the film tweak switch writes both of these together,
;                            because one without the other does nothing
;   [r_filmTweakContrast]      -> dvar_float r_filmTweakContrast   valueOffsets 0x10,0x20,0x30
;   [r_filmTweakBrightness]    -> dvar_float r_filmTweakBrightness valueOffsets 0x10,0x20,0x30
;   [r_filmTweakDesaturation]  -> dvar_float r_filmTweakDesaturation valueOffsets 0x10,0x20,0x30
;   [r_filmTweakLightTint]     -> dvar_float r_filmTweakLightTint  valueOffsets 0x10,0x14,0x18
;   [r_filmTweakMediumTint]    -> dvar_float r_filmTweakMediumTint valueOffsets 0x10,0x14,0x18
;   [r_filmTweakDarkTint]      -> dvar_float r_filmTweakDarkTint   valueOffsets 0x10,0x14,0x18
;                          - the film tweak switch writes all six
;                          - the tints are colour dvars; because every offset in
;                            the list receives the same bytes, the three offsets
;                            make the colour grey, which is what the game
;                            registers anyway. A real colour needs three
;                            different values, which one number cannot carry.
;   [cg_gun_x]     -> dvar_float cg_gun_x      valueOffsets 0x10,0x20,0x30
;   [cg_gun_y]     -> dvar_float cg_gun_y      valueOffsets 0x10,0x20,0x30
;   [cg_gun_z]     -> dvar_float cg_gun_z      valueOffsets 0x10,0x20,0x30
;                          - one switch in the window writes all three
;
;   type=bytes       signature=48 8B 05 ?? ?? ?? ?? 48 85 C0 74   patch=90 90
;   type=float       signature=...                                 value=90.0
;   type=float_ptr   signature=...  dispOffset=4  instrLen=8       value=90.0
;   type=dvar_int    cvar=com_maxfps   valueOffsets=0x10,0x20,0x30 value=1000
;   type=dvar_float  cvar=cg_fov       valueOffsets=0x10,0x20,0x30 value=90
;   type=dvar_float  cvar=r_filmTweakLightTint valueOffsets=0x10,0x14,0x18 value=1.1
;
; Signatures are IDA style, where ?? is a wildcard byte.
; docs/finding-signatures.md explains how every number was derived.
;
; Example of a fully manual dvar feature, equivalent to the [fps] preset:
;
;   [my_fps]
;   type=dvar_int
;   cvar=com_maxfps
;   valueOffsets=0x10,0x20,0x30
;   value=1000