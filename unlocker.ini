[general]
; How long to wait after injection before applying, in milliseconds.
delayMs=5000
; Key that toggles the patches on and off in game.
; 0x75 = F6, 0x76 = F7, 0x77 = F8, 0x78 = F9, 0x79 = F10, 0x7A = F11, 0x7B = F12
toggleKey=0x75
; Launcher only: 1 = the window closes when the game does, 0 = wait for a key.
closeWithGame=1
; The engine re-initialises some values after we write them - cg_fov in
; particular when a level loads, which is why the FOV may appear to need F6.
; With this on, the unlocker notices and re-applies them by itself.
; 1 = keep the values applied (recommended), 0 = write them once.
keepApplied=1
; How often to check, in milliseconds. A reset stays visible for this long
; before being corrected, so keep it short - the check is only a few 4-byte
; reads of our own memory.
keepAliveMs=50
; Optional. Leave empty to use whichever game you injected into.
gameExe=

; ---------------------------------------------------------------------------
; HOTKEYS  (the launcher's own: these two are not part of a profile)
; ---------------------------------------------------------------------------
[general]
; 0x75 = F6 toggles every patch on and off in game.
toggleKey=0x75
; 0x77 = F8 asks for the next profile: the window loads the next slot and applies
; it, so a running match switches profiles from the keyboard. The DLL polls this key
; in the game's process - the only place a keypress is certainly visible - and posts
; a message to the window, because the window is what owns the profile files.
nextProfileKey=0x77

; ---------------------------------------------------------------------------
; FRAME RATE CAP
; ---------------------------------------------------------------------------
[fps]
enabled=1
value=333

; ---------------------------------------------------------------------------
; FIELD OF VIEW
; ---------------------------------------------------------------------------
[fov]
enabled=1
value=67
max=0

[lagometer]
enabled=1
value=1

; ---------------------------------------------------------------------------
; TEST - the two HUD properties, switched on to see what they do in game.
;
;   objectiveFontSize  float, engine default 0.6, minimum 0.01. Read once.
;   cg_drawHealth      int, engine default 0 - "Draw health bar". Read twice.
;
; Both are read by iw4mp.exe, but read only means the HUD element they belong to
; would use them, not that multiplayer draws that element. Not in the window and
; off in the shipped default; here at enabled=1 because they are being tried.
; Set enabled=0 to put them back.
; ---------------------------------------------------------------------------
[objectiveFontSize]
enabled=1
type=dvar_float
cvar=objectiveFontSize
valueOffsets=0x10,0x20,0x30
value=0.1

[cg_drawHealth]
enabled=1
type=dvar_int
cvar=cg_drawHealth
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; GLOW - now a control in the window, under "Tweak the glow"
;
; It worked: with the four gates open and the values turned up, the bloom covers
; the screen and the picture washes out completely. So this is no longer a
; one-off test - the window has the switch and four sliders, plus a blur slider
; under them, and it writes these sections itself. Left at enabled=0 with the
; window's own gentler radius and intensity (1 and 2 rather than the 5 and 20 the
; engine registers, which already wash the screen out).
;
; The crash that came with the first attempt was ours, not the game's: r_glow
; resolved to a static table whose value slot holds a pointer rather than a
; number, and writing 1 over it brought the game down on the next map load.
; LocateDvar now refuses any candidate whose value slot points into the module.
; ---------------------------------------------------------------------------
[r_glow_allowed]
enabled=0
type=dvar_int
cvar=r_glow_allowed
valueOffsets=0x10,0x20,0x30
value=1

[r_glow]
enabled=0
type=dvar_int
cvar=r_glow
valueOffsets=0x10,0x20,0x30
value=1

[r_glowUseTweaks]
enabled=0
type=dvar_int
cvar=r_glowUseTweaks
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakEnable]
enabled=0
type=dvar_int
cvar=r_glowTweakEnable
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakRadius0]
enabled=0
type=dvar_float
cvar=r_glowTweakRadius0
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakBloomIntensity0]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomIntensity0
valueOffsets=0x10,0x20,0x30
value=2

[r_glowTweakBloomCutoff]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomCutoff
valueOffsets=0x10,0x20,0x30
value=0.5

[r_glowTweakBloomDesaturation]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomDesaturation
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; TEST - LASER
;
;     laserRadius      (0.8)  the radius of the beam itself  -> 3
;     laserLightRadius (3.0)  radius of the light at the far end -> 20
;     laserLight       (1.0)  whether that light is drawn at all: leave on.
;                             Tried enabled=1 in a match and nothing changed,
;                             which is what its default of 1 predicts - a
;                             section writing 1 cannot alter it. The gate is
;                             real all the same: `cmp byte ptr [rax + 0x10], 0;
;                             je <skip>` at rva 0xB2D84 (iw4mp) / 0xA5645
;                             (iw4sp), with a second condition beside it,
;                             `cmp dword ptr [rbp + 0x98], 1`. Discarded rather
;                             than shipped, since it has nothing to do.
;
; laserRange (1500), laserRangePlayer and laserFlarePct are read too but are
; left at their defaults, and two of the family are dead in this build:
; laserLightWithoutNightvision and laserDebug both have zero readers.
;
; Caveat: these are the beam the laser designator draws, which belongs to the
; campaign. A multiplayer match may never draw one, in which case nothing here
; can show up - unlike the glow above, which is drawn over everything.
; ---------------------------------------------------------------------------
[laserRadius]
enabled=1
type=dvar_float
cvar=laserRadius
valueOffsets=0x10,0x20,0x30
value=3

[laserLightRadius]
enabled=1
type=dvar_float
cvar=laserLightRadius
valueOffsets=0x10,0x20,0x30
value=20

; ---------------------------------------------------------------------------
; TEST - SCOREBOARD PING
;
;   cg_scoreboardPingText   (default 0)  "Whether to show numeric ping value"
;   cg_scoreboardPingGraph  (default 1)  "Whether to show graphical ping"
;
; Registered two apart in the scoreboard's own block, through the int helper:
; the text with 0 as its default (`xor edx, edx` at rva 0xE56A2) and the graph
; with 1 (`mov dl, 1` at 0xE56C1), which is why a match shows the graph and no
; number. Both are read by code - the graph as a gate that skips its drawing
; block when it is zero (`mov rax, [cache]; cmp byte ptr [rax + 0x10], 0; je` at
; 0xE3E54), the text as a value that selects one of two layout tables (read at
; 0xE388E and 0xE4625).
;
; Set as a pair, to test the numeric ping: text on, graph off. Put the graph back
; with value=1, or delete its section to leave it as the game had it.
; ---------------------------------------------------------------------------
[cg_scoreboardPingText]
enabled=1
type=dvar_int
cvar=cg_scoreboardPingText
valueOffsets=0x10,0x20,0x30
value=1

[cg_scoreboardPingGraph]
enabled=1
type=dvar_int
cvar=cg_scoreboardPingGraph
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; SCREEN  (r_blur, r_blacklevel)
;
; Neither has a gate in the game - nothing switches them and 0 is neutral - so
; both are always written by the window.
;
;   r_blur        confirmed working. Its slider sits at the foot of the glow
;                 column, so it is in reach while that column is open, and it runs
;                 the engine's whole range, 0.00 to 32.00: that ceiling is the
;                 registration's own (the float helper's xmm3, loaded from rva
;                 0x3CAA74) and the reader at 0x637D5 only tests the value against
;                 zero and squares it, so nothing clamps it at run time either.
;
;   r_blacklevel  does not work in a way you can see. Only two of its four
;                 references are real value reads (+0x30B14, +0xF1790) and both
;                 are a compare-and-re-apply path rather than the frame loop, so
;                 the value only lands at renderer set-up. No control in the
;                 window; set it here if you want to try it.
; ---------------------------------------------------------------------------
[r_blur]
enabled=1
type=dvar_float
cvar=r_blur
valueOffsets=0x10,0x20,0x30
value=0

[r_blacklevel]
enabled=1
type=dvar_float
cvar=r_blacklevel
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; HUD SAFE AREA  (the switch is the second one in the viewmodel card)
;
; The fraction of the screen the 2D overlay is laid out within: a smaller number
; pulls the whole HUD in towards the centre. Four floats, all between 0 and 1.
; Only the "adjusted" pair is in the window - the base pair was tried and moved
; nothing on screen, so it keeps its sections here but has no controls. Shipped
; off, at the values the engine registers.
; ---------------------------------------------------------------------------
[safeArea_horizontal]
enabled=0
type=dvar_float
cvar=safeArea_horizontal
valueOffsets=0x10,0x20,0x30
value=0.85

[safeArea_vertical]
enabled=0
type=dvar_float
cvar=safeArea_vertical
valueOffsets=0x10,0x20,0x30
value=0.85

[safeArea_adjusted_horizontal]
enabled=0
type=dvar_float
cvar=safeArea_adjusted_horizontal
valueOffsets=0x10,0x20,0x30
value=1

[safeArea_adjusted_vertical]
enabled=0
type=dvar_float
cvar=safeArea_adjusted_vertical
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; COMPASS SIZE  (compassSize)
;
; "Scale the compass", a float registered at 1.0 with 0 as its minimum and no
; real ceiling. A HUD size, so it sits in the safe-area column of the viewmodel
; card - but it has no gate of its own and does not ride that column's switch:
; the window writes it whenever it saves, like r_blur, so unticking the safe area
; leaves the compass alone. 1.00 is the game's value.
;
; ! 0 crashes the game: a scale of zero collapses the compass geometry and
; ! something downstream divides by it. The window's own floor is 0.1; this file
; ! is not floored, so do not put 0 here.
; ---------------------------------------------------------------------------
[compassSize]
enabled=1
type=dvar_float
cvar=compassSize
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; TESTING - THE CROSSHAIR SWITCH  (cg_drawCrosshair)
;
; An int registered at 1 ("Turn on weapon crosshair") and read once as a byte
; gate over a block of HUD code, so 0 hides it. The window's "Hide Crosshair"
; switch writes that 0: its enabled flag here means "hide", and the value is the
; fixed 0 that does it. Off by default.
; ---------------------------------------------------------------------------
[cg_drawCrosshair]
enabled=0
type=dvar_int
cvar=cg_drawCrosshair
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; TESTING - TIMESCALE  (timescale)
;
; The game's own clock: a float registered at 1.0, read as one. Below 1.0 slows
; the game down, above it speeds everything up; 1.0 is neutral. Gated with the
; gravity by the window's "Server" card, and restored when that switch is off;
; its slider covers 0.50 to 5.00 in hundredths. The floor is measured rather than
; the engine's: 0.001 is what the registration passes and nothing clamps the
; value, but below about 0.5 the game's own time sync fights the slowdown and the
; picture rubberbands, so the window starts where the engine still delivers.
; ---------------------------------------------------------------------------
[timescale]
enabled=1
type=dvar_float
cvar=timescale
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; TESTING - GRAVITY  (phys_gravity)
;
; "Physics gravity in units/sec^2." - the gravity on objects rather than on the
; player. A float registered at 800, which is the neutral value; a negative
; number inverts it. This is not g_gravity: the multiplayer binary does not have
; g_gravity at all, so this is its equivalent. No gate of its own, so the window
; always writes it, and its slider covers -2000 to 2000 in whole units.
;
; The shipped default is -800: the same magnitude as the engine's with the sign
; flipped, which is the end of the range worth trying in a match. 800 is the
; neutral value, so set that here to put the game back as it was.
; ---------------------------------------------------------------------------
[phys_gravity]
enabled=1
type=dvar_float
cvar=phys_gravity
valueOffsets=0x10,0x20,0x30
value=-800

; ---------------------------------------------------------------------------
; THIRD PERSON  (camera_thirdPerson)
;
; "Use third person view globally": an int, cached at 0x58D790, read by code as a
; gate in four places. The window's "Third person view" switch, in Other Settings,
; writes 1 when it is ticked and hands the engine's own value back when it is not.
; Off by default: it changes what the game draws.
; ---------------------------------------------------------------------------
[camera_thirdPerson]
enabled=0

; ---------------------------------------------------------------------------
; NEAR CLIP PLANE  (r_znear)
;
; "Things closer than this aren't drawn.  Reducing this increases the depth
; precision": a float read once at rva 0x24440 as
; `mov rax, [cache]; maxss xmm0, dword ptr [rax + 0x10]`. No gate, like r_blur -
; the section is always on and only the value moves. The window's "Z near" box is
; the whole of the "Debug" card at the foot of the window, and it goes from 0.00
; to 999.00: 100 was the window's ceiling rather than the engine's. It starts at
; 4.00, the value the engine registers, so an untouched box writes what is already
; there. The number is in engine units, and a larger value cuts the world away -
; anything nearer than it is simply not drawn.
; ---------------------------------------------------------------------------
[r_znear]
enabled=1
value=4

; ---------------------------------------------------------------------------
; TESTING - the film grade's invert flag, and two settings kept file-only
;
; [r_filmTweakInvert] is the window's "Invert the grade" switch, the row under the
; film tweak card's two columns. A plain int with no gate of its own, so the switch
; *is* the flag: ticking it writes the value below, unticking hands the engine's
; own value back.
;
; The other two were in the window for a build and were taken back out - both were
; tried, both worked, neither earned a permanent control. They stay as file-only
; settings: set enabled=1 here and the value is applied at injection.
;
;   [cg_footsteps]       "Play footstep sounds". Registered at **1** (cached at
;                        0x809BB0), so the value here is 0, which makes it silent:
;                        the inverted kind of section, like [cg_drawCrosshair].
;   [ui_debugMode]       "Draw ui debug info on the screen." Registered at 0
;                        (cached at 0x65FEE68) and read as a gate five times in
;                        multiplayer and five in single player.
; ---------------------------------------------------------------------------
[r_filmTweakInvert]
enabled=0
value=1

[cg_footsteps]
enabled=0
value=0

[ui_debugMode]
enabled=0
value=1

; ---------------------------------------------------------------------------
; DUAL WIELD, SPRINT SPEED AND MP PAUSED
;   (bg_forceDualWield, player_sprintSpeedScale, mp_paused)
;
; Three settings from one batch of checks. One became the slider at the foot of
; the window's "Debug" card, one the switch beside it, and the third was tried and
; discarded.
;
;   [bg_forceDualWield]       "Force akimbo for all possible weapons". An int
;                             registered at 0, cached at 0x589C18, read in three
;                             places, all of them weapon set-up. It was a switch
;                             in the window for one build; tried in a match, it
;                             moved nothing, so the control is gone and this
;                             section is file-only. The file's spelling has the
;                             capital W, and the unlocker looks a dvar up by its
;                             exact name string.
;
;   [player_sprintSpeedScale] "The scale applied to the player speed when
;                             sprinting". A float registered at 1.5 between 0 and
;                             2.0, read twice as a multiplier on a value already
;                             on its way into the movement code. Gateless, like
;                             [r_blur]: always on, only the value moves. The
;                             window's "Sprint speed" slider is the last row of
;                             the "Debug" card, with the mp_paused switch beside
;                             it. 1.0 - which reads like "normal" - is two thirds
;                             of the speed the game ships; 2.0 is the maximum.
;
;   [mp_paused]               "If true ignore server time advancing. Handy for
;                             taking hi-resolution screenshots without the world
;                             moving". An int registered at 0, multiplayer only,
;                             cached at 0x5AF6C8, read once. The window's "MP
;                             paused" switch, beside the sprint scale, writes the
;                             fixed 1 while it is ticked.
; ---------------------------------------------------------------------------
[bg_forceDualWield]
enabled=0

[player_sprintSpeedScale]
enabled=1
value=1.5

[mp_paused]
enabled=0

; ---------------------------------------------------------------------------
; PROFILE VIEW SENSITIVITY  (the profile's viewSensitivity field)
;
; Not a cvar, so this one is the manual kind of section: a byte signature and a
; pointer. It is the field behind the game's own `profile_setViewSensitivity`
; console command, which is registered through the *command* registrar rather
; than the dvar one - so there is no dvar for the locator to find, and the value
; lives in a plain global in the profile's controls block. What the command does
; is what this does: parse the argument as a number, store it, and store 0.01
; instead for anything below 0.01 (0 and negatives included).
;
; The signature is the command handler's own store followed by that floor, with
; the two displacements wildcarded:
;
;     movss [global], xmm2             F3 0F 11 15 ?? ?? ?? ??
;     jbe   <end>                      76 0A
;     mov   dword ptr [global], 0.01f  C7 05 ?? ?? ?? ?? 0A D7 23 3C
;
; dispOffset=4 and instrLen=8 are the first instruction's displacement and its
; length, which is how the unlocker turns the match into the address of the
; global. The handler sits at rva 0xF2139 in iw4mp.exe and 0xDA3F9 in iw4sp.exe,
; resolving to rva 0x8197C4 and 0x5DF554 respectively; the signature matches
; exactly once in both, so the one section covers both binaries.
;
; The game's own value for the field is 1.0: the only other writer is the
; controls-defaults reset, which puts 1.0 here, 0.8 into the two stick
; sensitivities beside it, and loads the strings "buttons_default" and
; "thumbstick_default". 0.01 is the floor the command applies.
;
; TRIED, AND DISCARDED: this was enabled at 1.5 for a match and the write landed
; in the running game - the log said "signature matched at 0x...", "resolved
; RIP-relative global -> 0x...", then "patcher: applied 'viewSensitivity' (4
; bytes at 0x...)" - and the aim did not change. So the field is not read while a
; match runs: the game writes it from the Controls menu and reads it when the
; profile is dealt with, not per frame. Left here disabled because the recipe -
; the signature and the two addresses - is worth keeping, not because it works.
;
; Changing `value` also needs a re-injection (F6 twice, or a restart): the live
; channel carries only the settings the window knows about.
; ---------------------------------------------------------------------------
[viewSensitivity]
enabled=0
type=float_ptr
signature=F3 0F 11 15 ?? ?? ?? ?? 76 0A C7 05 ?? ?? ?? ?? 0A D7 23 3C
dispOffset=4
instrLen=8
value=1.5

; ===========================================================================
; ADVANCED - you do not need any of this for normal use.
; ===========================================================================
;
; Each preset is shorthand for a full description, and you can override any part
; of it: `type=`, `cvar=`, `valueOffsets=`, `nameStringRva=` and `module=`.
;
; All of these are available:
;
;   [fps]     ->  dvar_int   com_maxfps       valueOffsets 0x10,0x20,0x30
;   [fov]     ->  dvar_float cg_fov           valueOffsets 0x10,0x20,0x30, optional max= for the +0x44 clamp
;   [drawfps] ->  dvar_int   cg_drawFPS       valueOffsets 0x10,0x20,0x30  (single player only)
;   [netfps]  ->  dvar_int   sv_network_fps   valueOffsets 0x10,0x20,0x30
;
;   type=bytes       signature=48 8B 05 ?? ?? ?? ?? 48 85 C0 74   patch=90 90
;   type=float       signature=...                                 value=90.0
;   type=float_ptr   signature=...  dispOffset=4  instrLen=8       value=90.0
;   type=dvar_int    cvar=com_maxfps   valueOffsets=0x10,0x20,0x30 value=1000
;   type=dvar_float  cvar=cg_fov       valueOffsets=0x10,0x20,0x30 value=90
;
; Signatures are IDA style, where ?? is a wildcard byte.
; docs/finding-signatures.md explains how every number was derived.
;
; Example of a fully manual dvar feature, equivalent to the [fps] preset:
;
;   [my_fps]
;   type=dvar_int
;   cvar=com_maxfps
;   valueOffsets=0x10,0x20,0x30
;   value=1000

