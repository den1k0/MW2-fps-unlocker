[general]
; How long to wait after injection before applying, in milliseconds.
delayMs=5000
; Key that toggles the patches on and off in game.
; 0x75 = F6, 0x76 = F7, 0x77 = F8, 0x78 = F9, 0x79 = F10, 0x7A = F11, 0x7B = F12
toggleKey=0x75
; Launcher only: 1 = the window closes when the game does, 0 = wait for a key.
closeWithGame=1
; The engine re-initialises some values after we write them - cg_fov in
; particular when a level loads, which is why the FOV may appear to need F6.
; With this on, the unlocker notices and re-applies them by itself.
; 1 = keep the values applied (recommended), 0 = write them once.
keepApplied=1
; How often to check, in milliseconds. A reset stays visible for this long
; before being corrected, so keep it short - the check is only a few 4-byte
; reads of our own memory.
keepAliveMs=50
; Optional. Leave empty to use whichever game you injected into.
gameExe=

; ---------------------------------------------------------------------------
; FRAME RATE CAP
; ---------------------------------------------------------------------------
[fps]
enabled=1
value=333

; ---------------------------------------------------------------------------
; FIELD OF VIEW
; ---------------------------------------------------------------------------
[fov]
enabled=0
value=65
;max=179

[lagometer]
enabled=1
value=1

; ---------------------------------------------------------------------------
; TEST - the two HUD properties, switched on to see what they do in game.
;
;   objectiveFontSize  float, engine default 0.6, minimum 0.01. Read once.
;   cg_drawHealth      int, engine default 0 - "Draw health bar". Read twice.
;
; Both are read by iw4mp.exe, but read only means the HUD element they belong to
; would use them, not that multiplayer draws that element. Not in the window and
; off in the shipped default; here at enabled=1 because they are being tried.
; Set enabled=0 to put them back.
; ---------------------------------------------------------------------------
[objectiveFontSize]
enabled=1
type=dvar_float
cvar=objectiveFontSize
valueOffsets=0x10,0x20,0x30
value=0.1

[cg_drawHealth]
enabled=1
type=dvar_int
cvar=cg_drawHealth
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; GLOW - now a control in the window, under "Tweak the glow"
;
; It worked: with the four gates open and the values turned up, the bloom covers
; the screen and the picture washes out completely. So this is no longer a
; one-off test - the window has the switch and four sliders, plus a blur slider
; under them, and it writes these sections itself. Left at enabled=0 with the
; window's own gentler radius and intensity (1 and 2 rather than the 5 and 20 the
; engine registers, which already wash the screen out).
;
; The crash that came with the first attempt was ours, not the game's: r_glow
; resolved to a static table whose value slot holds a pointer rather than a
; number, and writing 1 over it brought the game down on the next map load.
; LocateDvar now refuses any candidate whose value slot points into the module.
; ---------------------------------------------------------------------------
[r_glow_allowed]
enabled=0
type=dvar_int
cvar=r_glow_allowed
valueOffsets=0x10,0x20,0x30
value=1

[r_glow]
enabled=0
type=dvar_int
cvar=r_glow
valueOffsets=0x10,0x20,0x30
value=1

[r_glowUseTweaks]
enabled=0
type=dvar_int
cvar=r_glowUseTweaks
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakEnable]
enabled=0
type=dvar_int
cvar=r_glowTweakEnable
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakRadius0]
enabled=0
type=dvar_float
cvar=r_glowTweakRadius0
valueOffsets=0x10,0x20,0x30
value=1

[r_glowTweakBloomIntensity0]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomIntensity0
valueOffsets=0x10,0x20,0x30
value=2

[r_glowTweakBloomCutoff]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomCutoff
valueOffsets=0x10,0x20,0x30
value=0.5

[r_glowTweakBloomDesaturation]
enabled=0
type=dvar_float
cvar=r_glowTweakBloomDesaturation
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; TEST - LASER
;
;     laserRadius      (0.8)  the radius of the beam itself  -> 3
;     laserLightRadius (3.0)  radius of the light at the far end -> 20
;     laserLight       (1.0)  whether that light is drawn at all: leave on
;
; laserRange (1500), laserRangePlayer and laserFlarePct are read too but are
; left at their defaults, and two of the family are dead in this build:
; laserLightWithoutNightvision and laserDebug both have zero readers.
;
; Caveat: these are the beam the laser designator draws, which belongs to the
; campaign. A multiplayer match may never draw one, in which case nothing here
; can show up - unlike the glow above, which is drawn over everything.
; ---------------------------------------------------------------------------
[laserRadius]
enabled=1
type=dvar_float
cvar=laserRadius
valueOffsets=0x10,0x20,0x30
value=3

[laserLightRadius]
enabled=1
type=dvar_float
cvar=laserLightRadius
valueOffsets=0x10,0x20,0x30
value=20

; ---------------------------------------------------------------------------
; SCREEN  (r_blur, r_blacklevel)
;
; Neither has a gate in the game - nothing switches them and 0 is neutral - so
; both are always written by the window.
;
;   r_blur        confirmed working. Its slider sits at the foot of the glow
;                 column, so it is in reach while that column is open. Read once,
;                 where the blur pass is set up.
;
;   r_blacklevel  does not work in a way you can see. Only two of its four
;                 references are real value reads (+0x30B14, +0xF1790) and both
;                 are a compare-and-re-apply path rather than the frame loop, so
;                 the value only lands at renderer set-up. No control in the
;                 window; set it here if you want to try it.
; ---------------------------------------------------------------------------
[r_blur]
enabled=1
type=dvar_float
cvar=r_blur
valueOffsets=0x10,0x20,0x30
value=0

[r_blacklevel]
enabled=1
type=dvar_float
cvar=r_blacklevel
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; HUD SAFE AREA  (the switch is the second one in the viewmodel card)
;
; The fraction of the screen the 2D overlay is laid out within: a smaller number
; pulls the whole HUD in towards the centre. Four floats, all between 0 and 1.
; Only the "adjusted" pair is in the window - the base pair was tried and moved
; nothing on screen, so it keeps its sections here but has no controls. Shipped
; off, at the values the engine registers.
; ---------------------------------------------------------------------------
[safeArea_horizontal]
enabled=0
type=dvar_float
cvar=safeArea_horizontal
valueOffsets=0x10,0x20,0x30
value=0.85

[safeArea_vertical]
enabled=0
type=dvar_float
cvar=safeArea_vertical
valueOffsets=0x10,0x20,0x30
value=0.85

[safeArea_adjusted_horizontal]
enabled=0
type=dvar_float
cvar=safeArea_adjusted_horizontal
valueOffsets=0x10,0x20,0x30
value=1

[safeArea_adjusted_vertical]
enabled=0
type=dvar_float
cvar=safeArea_adjusted_vertical
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; COMPASS SIZE  (compassSize)
;
; "Scale the compass", a float registered at 1.0 with 0 as its minimum and no
; real ceiling. A HUD size, so it sits in the safe-area column of the viewmodel
; card - but it has no gate of its own and does not ride that column's switch:
; the window writes it whenever it saves, like r_blur, so unticking the safe area
; leaves the compass alone. 1.00 is the game's value.
;
; ! 0 crashes the game: a scale of zero collapses the compass geometry and
; ! something downstream divides by it. The window's own floor is 0.1; this file
; ! is not floored, so do not put 0 here.
; ---------------------------------------------------------------------------
[compassSize]
enabled=1
type=dvar_float
cvar=compassSize
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; TESTING - THE CROSSHAIR SWITCH  (cg_drawCrosshair)
;
; An int registered at 1 ("Turn on weapon crosshair") and read once as a byte
; gate over a block of HUD code, so 0 hides it. The window's "Hide the crosshair"
; switch writes that 0: its enabled flag here means "hide", and the value is the
; fixed 0 that does it. Off by default.
; ---------------------------------------------------------------------------
[cg_drawCrosshair]
enabled=0
type=dvar_int
cvar=cg_drawCrosshair
valueOffsets=0x10,0x20,0x30
value=0

; ---------------------------------------------------------------------------
; TESTING - TIMESCALE  (timescale)
;
; The game's own clock: a float registered at 1.0, read as one. Below 1.0 slows
; the game down, above it speeds everything up; 1.0 is neutral. No gate of its
; own, so the window always writes it, and its slider covers 0.10 to 5.00 in
; hundredths. It sits with the gravity in the window's "Server" card.
; ---------------------------------------------------------------------------
[timescale]
enabled=0
type=dvar_float
cvar=timescale
valueOffsets=0x10,0x20,0x30
value=1

; ---------------------------------------------------------------------------
; TESTING - GRAVITY  (phys_gravity)
;
; "Physics gravity in units/sec^2." - the gravity on objects rather than on the
; player. A float registered at 800, which is the neutral value; a negative
; number inverts it. This is not g_gravity: the multiplayer binary does not have
; g_gravity at all, so this is its equivalent. No gate of its own, so the window
; always writes it, and its slider covers -2000 to 2000 in whole units.
;
; The shipped default is -800: the same magnitude as the engine's with the sign
; flipped, which is the end of the range worth trying in a match. 800 is the
; neutral value, so set that here to put the game back as it was.
; ---------------------------------------------------------------------------
[phys_gravity]
enabled=0
type=dvar_float
cvar=phys_gravity
valueOffsets=0x10,0x20,0x30
value=-800

; ===========================================================================
; ADVANCED - you do not need any of this for normal use.
; ===========================================================================
;
; Each preset is shorthand for a full description, and you can override any part
; of it: `type=`, `cvar=`, `valueOffsets=`, `nameStringRva=` and `module=`.
;
; All of these are available:
;
;   [fps]     ->  dvar_int   com_maxfps       valueOffsets 0x10,0x20,0x30
;   [fov]     ->  dvar_float cg_fov           valueOffsets 0x10,0x20,0x30, optional max= for the +0x44 clamp
;   [drawfps] ->  dvar_int   cg_drawFPS       valueOffsets 0x10,0x20,0x30  (single player only)
;   [netfps]  ->  dvar_int   sv_network_fps   valueOffsets 0x10,0x20,0x30
;
;   type=bytes       signature=48 8B 05 ?? ?? ?? ?? 48 85 C0 74   patch=90 90
;   type=float       signature=...                                 value=90.0
;   type=float_ptr   signature=...  dispOffset=4  instrLen=8       value=90.0
;   type=dvar_int    cvar=com_maxfps   valueOffsets=0x10,0x20,0x30 value=1000
;   type=dvar_float  cvar=cg_fov       valueOffsets=0x10,0x20,0x30 value=90
;
; Signatures are IDA style, where ?? is a wildcard byte.
; docs/finding-signatures.md explains how every number was derived.
;
; Example of a fully manual dvar feature, equivalent to the [fps] preset:
;
;   [my_fps]
;   type=dvar_int
;   cvar=com_maxfps
;   valueOffsets=0x10,0x20,0x30
;   value=1000
